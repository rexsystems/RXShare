version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Runtime is Node 22 LTS, so type definitions stay on the matching major
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      react-router:
        patterns: ["react-router", "@react-router/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node image changes are done by hand after checking native modules (sharp, better-sqlite3)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
